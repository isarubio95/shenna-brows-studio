    <link rel="icon" type="image/png" href="/favicon.png" sizes="32x32" />

    <title>Shenna BROWS — Herramientas Profesionales de Cejas</title>

    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Precarga el hero guardado (misma clave que SITE_CONTENT_CACHE_KEY). El de /public/hero solo es el fallback. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("shenna.site-content.v1");
          if (!raw) return;
          var row = JSON.parse(raw).index_hero;
          if (!row || typeof row.content !== "string") return;
          var cfg = JSON.parse(row.content);
          var mobile = window.matchMedia("(max-width: 767px)").matches;
          var url = String((mobile ? cfg.mobileImageUrl : cfg.desktopImageUrl) || cfg.desktopImageUrl || "").trim();
          if (!url || /\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url)) return;
          var link = document.createElement("link");
          link.rel = "preload";
          link.as = "image";
          link.href = url;
          link.setAttribute("fetchpriority", "high");
          document.head.appendChild(link);
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,900;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
